name: SDK pkg.pr.new Preview

on:
  push:
    branches:
      - andrew-pkg-pr-new-sdk
    paths:
      - '.github/workflows/sdk_pkg_pr_new.yaml'
      - 'libs/sdk-typescript/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  publish-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish SDK preview package
        run: PATH="$PWD/node_modules/.bin:$PATH" npx pkg-pr-new publish --comment=off ./libs/sdk-typescript
